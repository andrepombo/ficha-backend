name: Deploy Backend to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify deployment files
        run: |
          echo "Files to be deployed:"
          ls -la
          echo "Docker compose file:"
          cat docker-compose.yml
          echo "Deployment script:"
          cat deploy.sh

      - name: Copy files to VPS
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          ARGS: "-rlgoDzvc -i"
          SOURCE: "./"
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_SSH_USER }}
          TARGET: '/home/${{ secrets.VPS_SSH_USER }}/apps/app1/backend'
          EXCLUDE: "/dist/, /node_modules/, /.git/, /venv/, /__pycache__/, *.pyc"
          SCRIPT_AFTER: |
            echo "Files copied successfully"
            echo "Cleaning up unused Docker resources..."
            docker system prune -f

      - name: Build and start containers
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Build and start only the backend service from the main app1 stack
            cd /home/${{ secrets.VPS_SSH_USER }}/apps/app1
            
            echo "Building and starting backend container..."
            docker compose up -d --build backend
            
            echo "Waiting for services to start..."
            sleep 30
            
            echo "Checking container status for backend..."
            docker compose ps backend
            
            echo "Deployment completed successfully!"
